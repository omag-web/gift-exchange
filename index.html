<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
:root{
  --pine:#0e3b2e; --pine-2:#165141; --pine-3:#1f6a55;
  --berry:#b0283f; --berry-2:#8c1c30;
  --gold:#c8a24a; --gold-2:#a8852f;
  --navy:#3a6a9a;
  --cream:#fbf5e9; --paper:#fffdf8; --line:#e8dfcd;
  --ink:#1c2420; --muted:#5d6964;
  --radius:16px;
  --shadow:0 1px 2px rgba(14,59,46,.06), 0 8px 28px rgba(14,59,46,.08);
  --display:"Fraunces", Georgia, serif;
  --body:"DM Sans", system-ui, -apple-system, Segoe UI, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--cream);line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(200,162,74,.10) 1px, transparent 1.2px);background-size:22px 22px}
a{color:var(--berry)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;color:var(--pine);font-weight:600}
button,input,select,textarea{font:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.demo-bar{background:var(--gold);color:#2b2108;font-size:13px;text-align:center;padding:7px 12px}
.demo-bar button{background:none;border:0;text-decoration:underline;cursor:pointer;color:inherit;font-weight:700;padding:0 4px}
header.top{background:var(--pine);color:var(--cream);position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.08)}
header.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream);font-family:var(--display);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .logo{height:21px;width:auto;flex:none;display:block}
.brand-sep{width:1px;height:22px;background:rgba(251,245,233,.3);flex:none}
nav.links{margin-left:auto;display:flex;gap:4px}
nav.links a{color:rgba(251,245,233,.85);text-decoration:none;font-size:14px;font-weight:500;padding:7px 12px;border-radius:999px}
nav.links a:hover{background:rgba(255,255,255,.08);color:#fff}
nav.links a.on{background:rgba(255,255,255,.12);color:#fff}
nav.links a.cta{background:var(--berry);color:#fff}
nav.links a.cta:hover{background:var(--berry-2)}
.brand{min-width:0} nav.links a{white-space:nowrap}
.brand span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){nav.links a[href="#home"]{display:none}.brand{font-size:16px}.brand .logo{height:17px}nav.links a{padding:6px 10px;font-size:13px}header.top .wrap{gap:10px;padding:0 14px}}

/* Hero */
.hero{position:relative;background:radial-gradient(1200px 500px at 80% -10%, rgba(200,162,74,.25), transparent 60%),linear-gradient(180deg,var(--pine) 0%, #0b3226 100%);color:var(--cream);overflow:hidden;padding:64px 0 120px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{color:var(--cream);font-size:clamp(40px,7vw,78px);font-weight:800;letter-spacing:-.02em;margin:14px 0 16px;max-width:14ch}
.hero h1 em{font-style:italic;font-weight:500;color:var(--gold)}
.hero p.lead{font-size:18px;max-width:52ch;color:rgba(251,245,233,.85);margin:0 0 30px}
.ornaments{position:absolute;right:4%;top:0;z-index:1;display:flex;gap:26px;pointer-events:none}
.orn{transform-origin:top center;animation:sway 6s ease-in-out infinite}
.orn:nth-child(2){animation-delay:-2s}.orn:nth-child(3){animation-delay:-4s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (max-width:760px){.ornaments{display:none}}

.countdown{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.cd-label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:rgba(251,245,233,.7);margin-bottom:10px;font-weight:700}
.cd-tile{background:var(--cream);color:var(--pine);border-radius:12px;min-width:84px;padding:12px 10px 8px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative}
.cd-tile::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(14,59,46,.08)}
.cd-num{font-family:var(--display);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cd-unit{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s, background .15s, box-shadow .15s;line-height:1.1}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--berry);color:#fff;box-shadow:0 6px 18px rgba(176,40,63,.35)}
.btn-primary:hover{background:var(--berry-2)}
.btn-gold{background:var(--gold);color:#251c05}
.btn-gold:hover{background:#d6b25c}
.btn-ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn-ghost:hover{background:rgba(127,127,127,.08)}
.btn-pine{background:var(--pine);color:var(--cream)}
.btn-pine:hover{background:var(--pine-2)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-danger{background:transparent;color:var(--berry);box-shadow:inset 0 0 0 1.5px var(--berry)}
.btn-danger:hover{background:rgba(176,40,63,.06)}

/* Facts */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-70px;position:relative;z-index:2}
.fact{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow)}
.fact .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fact .v{font-family:var(--display);font-size:20px;font-weight:600;color:var(--pine);margin-top:4px;line-height:1.25}
@media (max-width:820px){.facts{grid-template-columns:repeat(2,1fr)}}

section.block{padding:56px 0 8px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(28px,4vw,38px)}
.sec-head p{margin:6px 0 0;color:var(--muted)}
.count-pill{background:var(--pine);color:var(--cream);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}

/* Gift tags board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px 14px}
.tag{position:relative;background:var(--paper);border:1px solid var(--line);padding:14px 14px 14px 34px;display:flex;align-items:center;gap:12px;
  clip-path:polygon(18px 0,100% 0,100% 100%,18px 100%,0 50%);border-radius:0 12px 12px 0;box-shadow:var(--shadow);
  transform:rotate(var(--r,0deg));transition:transform .25s;animation:pop .45s both}
.tag:hover{transform:rotate(0) translateY(-2px)}
.tag::before{content:"";position:absolute;left:14px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--gold-2)}
.tag .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.tag .nm{font-weight:700;line-height:1.2}
.tag .when{font-size:12px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.empty{border:2px dashed var(--line);border-radius:var(--radius);padding:36px;text-align:center;color:var(--muted);background:rgba(255,253,248,.6)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden}
.step .n{font-family:var(--display);font-style:italic;font-size:54px;color:var(--gold);line-height:.9;font-weight:700}
.step h3{font-size:22px;margin:10px 0 6px}
.step p{margin:0;color:var(--muted)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

footer{padding:56px 0 40px;color:var(--muted);font-size:13px;text-align:center}
footer a{color:var(--muted)}

/* Cards / forms */
.page{padding-top:44px;padding-bottom:20px}
.page-title{font-size:clamp(32px,5vw,48px);font-weight:800;letter-spacing:-.01em}
.page-sub{color:var(--muted);margin:8px 0 26px;max-width:62ch;font-size:17px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.card + .card{margin-top:18px}
.card h2{font-size:26px;margin-bottom:6px}
.card .sub{color:var(--muted);margin:0 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.full{grid-column:1/-1}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.card{padding:22px}}
label.f{display:block}
label.f > span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
label.f > small{display:block;color:var(--muted);font-size:12.5px;margin:-3px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=datetime-local],select,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;color:var(--ink);transition:border-color .15s, box-shadow .15s}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pine-3);box-shadow:0 0 0 4px rgba(31,106,85,.14)}
.divider{display:flex;align-items:center;gap:12px;color:var(--gold-2);font-family:var(--display);font-style:italic;font-size:18px;margin:26px 0 16px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.form-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}
.err{background:#fdecef;color:var(--berry-2);border:1px solid #f4c9d1;border-radius:10px;padding:10px 14px;margin-top:16px;font-size:14px}
.note{background:#f3efe2;border-radius:10px;padding:12px 14px;font-size:14px;color:#4d4a3e}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills label{position:relative;cursor:pointer}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills span{display:inline-block;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;transition:.15s}
.pills label:hover span{border-color:var(--pine-3)}
.pills input:checked + span{background:var(--pine);border-color:var(--pine);color:var(--cream)}
.pills input:focus-visible + span{box-shadow:0 0 0 4px rgba(31,106,85,.2)}
.choice-detail{margin-top:8px}
.steps.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.steps.four{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.steps.four{grid-template-columns:1fr}}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--pine)}

.linkbox{display:flex;gap:8px;margin:14px 0}
.linkbox input{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#faf7ef}

/* Wish list display */
.wish{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.wish .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.wish .item.wide{grid-column:1/-1}
.wish .q{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wish .a{margin-top:3px;font-size:15.5px;white-space:pre-wrap;word-wrap:break-word}
.wish .a.none{color:#a7aea9;font-style:italic}
@media (max-width:600px){.wish{grid-template-columns:1fr}}

.me-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.me-grid{grid-template-columns:1fr}}
.status{display:flex;gap:14px;align-items:center;background:var(--pine);color:var(--cream);border-radius:var(--radius);padding:18px 22px;margin-bottom:18px}
.status .ic{font-size:28px}
.status b{font-family:var(--display);font-size:20px;font-weight:600;display:block}
.status span{opacity:.85;font-size:14px}

/* Reveal */
.reveal-stage{text-align:center;padding:30px 10px 10px}
.giftbox{width:180px;height:180px;margin:10px auto 0;position:relative;cursor:pointer;border:0;background:none;padding:0;display:block}
.giftbox .body{position:absolute;left:14px;right:14px;bottom:0;height:118px;background:var(--berry);border-radius:6px 6px 10px 10px;box-shadow:inset 0 -12px 0 rgba(0,0,0,.12)}
.giftbox .lid{position:absolute;left:4px;right:4px;top:38px;height:36px;background:#c2304a;border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .7s cubic-bezier(.3,1.6,.5,1), opacity .6s}
.giftbox .rib-v{position:absolute;left:50%;width:26px;margin-left:-13px;background:var(--gold);top:38px;bottom:0;border-radius:2px}
.giftbox .bow{position:absolute;left:50%;top:6px;width:90px;margin-left:-45px;height:40px;transition:transform .7s cubic-bezier(.3,1.6,.5,1), opacity .6s}
.giftbox .bow::before,.giftbox .bow::after{content:"";position:absolute;top:4px;width:40px;height:30px;border:7px solid var(--gold);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.giftbox .bow::before{left:0;transform:rotate(-18deg)}
.giftbox .bow::after{right:0;transform:rotate(18deg)}
.giftbox:hover{animation:wiggle .6s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.giftbox.open{animation:none;pointer-events:none}
.giftbox.open .lid,.giftbox.open .bow{transform:translateY(-120px) rotate(-24deg);opacity:0}
.giftbox.open .body,.giftbox.open .rib-v{transition:opacity .5s .35s;opacity:0}
.tap-hint{margin-top:16px;color:var(--muted);font-family:var(--display);font-style:italic;font-size:19px}
.rcard{animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
.r-eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--berry);font-weight:700}
.r-name{font-family:var(--display);font-size:clamp(38px,6vw,58px);font-weight:800;color:var(--pine);margin:6px 0 4px;letter-spacing:-.01em}
.r-meta{color:var(--muted);margin-bottom:20px}

/* Q&A */
.thread{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bubble{border-radius:14px;padding:11px 14px;max-width:92%;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bubble small{display:block;font-size:11px;opacity:.7;margin-bottom:2px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.bubble.q{background:#f1ece0;align-self:flex-start}
.bubble.a{background:var(--pine);color:var(--cream);align-self:flex-end}
.bubble.wait{background:transparent;border:1.5px dashed var(--line);color:var(--muted);align-self:flex-end;font-style:italic}
.askrow{display:flex;gap:8px;margin-top:12px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold);color:#251c05;font-size:11.5px;font-weight:800;margin-left:6px;vertical-align:middle;font-family:var(--body)}
.badge.new{background:var(--berry);color:#fff;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;height:22px;padding:0 9px}
nav.links .badge{margin-left:5px;height:18px;min-width:18px;font-size:11px}
input.pin{letter-spacing:.5em;font-size:20px;font-weight:700;text-align:center;max-width:170px;font-family:ui-monospace,Menlo,Consolas,monospace}
.pinbig{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:40px;font-weight:800;letter-spacing:.35em;color:var(--pine);text-align:center;margin:6px 0 2px}
.askrow input{flex:1}

/* Admin */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;color:var(--pine)}
@media (max-width:760px){.stats{grid-template-columns:1fr}}
.phase-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.phase-open{background:#e3f2ea;color:var(--pine)}
.phase-closed{background:#fbf0d9;color:#7a5a12}
.phase-revealed{background:#fbe3e8;color:var(--berry-2)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
table.people{width:100%;border-collapse:collapse;font-size:14px}
table.people th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.people td{padding:10px;border-bottom:1px solid #f0e9da;vertical-align:middle}
table.people td.r{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}

/* Toast + modal */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:100;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(14,30,24,.55);display:grid;place-items:center;z-index:90;padding:20px;animation:fade .2s}
.modal{background:var(--paper);border-radius:var(--radius);padding:26px;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal h3{font-size:24px;margin-bottom:8px}
.modal p{color:var(--muted);margin:0 0 20px}
.modal .actions{justify-content:flex-end}
@keyframes fade{from{opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.spinner{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--berry);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

/* Print */
#print-area{display:none}
@media print{
  body{background:#fff}
  body > *:not(#print-area){display:none !important}
  #print-area{display:block;font-family:Georgia,serif;color:#000;padding:10px 6px}
  #print-area h1{font-size:28px;margin:0 0 2px;color:#000}
  #print-area .pmeta{font-size:12px;color:#444;margin-bottom:18px;font-family:Arial,sans-serif}
  #print-area .prow{border-bottom:1px solid #ccc;padding:9px 0;page-break-inside:avoid}
  #print-area .pq{font-family:Arial,sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#555}
  #print-area .pa{font-size:15px;margin-top:2px;white-space:pre-wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<body>
<div id="demo-bar" class="demo-bar" hidden>Demo mode: everything is saved only in this browser. Admin passcode is <b>demo</b>. <button id="demo-reset" type="button">Reset demo</button></div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">
      <img class="logo" src="omag-logo.png" alt="OMAG" width="96" height="21"><span class="brand-sep" aria-hidden="true"></span>
      <span id="brand-name">Secret Santa</span>
    </a>
    <nav class="links" id="nav"></nav>
  </div>
</header>
<main id="app"><div class="loading"><span class="spinner"></span></div></main>
<footer>
  <div class="wrap">Made with care for the OMAG team · <a href="#lost">Sign in on another device</a> · <a href="#admin">Organizer</a></div>
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<div id="print-area"></div>

<script>
/* =====================================================================
   Utilities
   ===================================================================== */
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const safe = (fn, fallback = null) => { try { return fn(); } catch { return fallback; } };
const local = {
  get: k => safe(() => localStorage.getItem(k)),
  set: (k, v) => safe(() => localStorage.setItem(k, v)),
  del: k => safe(() => localStorage.removeItem(k)),
};
const session = {
  get: k => safe(() => sessionStorage.getItem(k)),
  set: (k, v) => safe(() => sessionStorage.setItem(k, v)),
  del: k => safe(() => sessionStorage.removeItem(k)),
};
let memToken = null, memAdmin = null; // fallbacks if storage is blocked
const getToken = () => local.get("gx_token") || memToken;
const setToken = t => { memToken = t; t ? local.set("gx_token", t) : local.del("gx_token"); };
const getAdminKey = () => session.get("gx_admin") || memAdmin;
const setAdminKey = k => { memAdmin = k; k ? session.set("gx_admin", k) : session.del("gx_admin"); };

function fmtDate(iso, opts) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString("en-US", opts || { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
const fmtDay = iso => fmtDate(iso, { month: "short", day: "numeric" });
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const fromLocalInput = v => v ? new Date(v).toISOString() : "";
const firstName = n => String(n || "").trim().split(/\s+/)[0] || "";
const initials = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(s => s[0]).join("").toUpperCase();
const AV_COLORS = ["#b0283f", "#165141", "#a8852f", "#3a6a9a", "#7a3b69", "#1f6a55"];
const avColor = n => AV_COLORS[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % AV_COLORS.length];

function toast(msg, ms = 3200) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}
function confirmBox(title, body, okLabel = "Continue", danger = false) {
  return new Promise(resolve => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(body)}</p>
      <div class="actions"><button class="btn btn-ghost btn-sm" data-x="0">Cancel</button>
      <button class="btn ${danger ? "btn-primary" : "btn-pine"} btn-sm" data-x="1">${esc(okLabel)}</button></div></div>`;
    const done = v => { bg.remove(); resolve(v); };
    bg.addEventListener("click", e => { if (e.target === bg) done(false); const x = e.target.closest("[data-x]"); if (x) done(x.dataset.x === "1"); });
    document.body.appendChild(bg);
    $("[data-x='1']", bg).focus();
  });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied!"); }
  catch { toast("Couldn't copy automatically. Select the text and copy it."); }
}
function questionLabel(id) { return (CONFIG.QUESTIONS.find(q => q.id === id) || {}).label || id; }

function phaseOf(c, now = Date.now()) {
  const reveal = c.revealAt ? Date.parse(c.revealAt) : NaN;
  const dl = c.signupDeadline ? Date.parse(c.signupDeadline) : NaN;
  if (c.drawnAt && (isNaN(reveal) || now >= reveal)) return "revealed";
  if (c.drawnAt || (!isNaN(dl) && now >= dl)) return "closed";
  return "open";
}

/* =====================================================================
   API — Supabase RPC (or the in-browser demo backend)
   ===================================================================== */
async function rpc(fn, args = {}) {
  if (DEMO) return Mock.call(fn, args);
  const key = CONFIG.SUPABASE_ANON_KEY;
  const headers = { apikey: key, "content-type": "application/json" };
  if (key.startsWith("eyJ")) headers.Authorization = `Bearer ${key}`; // legacy JWT anon keys
  let res;
  try {
    res = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/$/, "")}/rest/v1/rpc/${fn}`, { method: "POST", headers, body: JSON.stringify(args) });
  } catch { throw new Error("Can't reach the server. Check your connection and try again."); }
  const text = await res.text();
  const data = safe(() => (text ? JSON.parse(text) : null));
  if (!res.ok) throw new Error((data && data.message) || "Something went wrong. Please try again.");
  return data;
}

/* =====================================================================
   Demo backend — mirrors supabase/schema.sql, stored in localStorage
   ===================================================================== */
const Mock = {
  key: "gx_demo_state_v3", mem: null,
  load() {
    if (this.mem) return this.mem;
    this.mem = safe(() => JSON.parse(localStorage.getItem(this.key))) || this.seed();
    return this.mem;
  },
  save() { local.set(this.key, JSON.stringify(this.mem)); },
  reset() { this.mem = this.seed(); this.save(); setToken(null); },
  uid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)); },
  seed() {
    const now = Date.now(), day = 864e5;
    const people = [
      ["Avery Collins", { salty: "Kettle chips", sweet: "Peanut butter cups", baked: "Banana bread", drink: "Iced vanilla latte", restaurant: "Chuy's", sports: "OU", colors: "Sage green", scent: "Vanilla", bookstore: "Barnes & Noble", hobbies: "Pickleball, podcasts", stores: "Target", need: "A good desk lamp", want: "Cozy throw blanket", avoid: "Tree nuts, please!", lotions: "Yes", lotions_scent: "Vanilla", candles: "Yes", candles_scent: "Sandalwood", alcohol: "No", chocolate: "Yes, but no nuts", collection: "Coffee mugs from road trips", splurge: "Fancy hand cream" }],
      ["Jordan Reyes", { salty: "Takis", sweet: "Sour gummy worms", drink: "Dr Pepper", restaurant: "Whataburger", sports: "Thunder", colors: "Blue", hobbies: "Grilling", stores: "Academy", need: "Phone car mount", want: "Thunder hoodie", lotions: "No", candles: "No", alcohol: "Yes", alcohol_flavor: "IPAs", chocolate: "Yes", splurge: "Nice BBQ rub" }],
      ["Taylor Nguyen", { sweet: "Dark chocolate", baked: "Macarons", drink: "Green tea", colors: "Emerald", scent: "Eucalyptus", hobbies: "Plants, yoga", stores: "Trader Joe's", need: "Water bottle", want: "A new houseplant", avoid: "No more mugs, I have 40", lotions: "Yes", lotions_scent: "Unscented", candles: "Yes", candles_scent: "Eucalyptus", alcohol: "Yes", alcohol_flavor: "Rosé", chocolate: "Yes", collection: "Succulents" }],
      ["Morgan Blake", { salty: "Pretzels", sweet: "Cinnamon bears", baked: "Cinnamon rolls", drink: "Black coffee", sports: "OSU", colors: "Orange", hobbies: "Puzzles", stores: "Hobby Lobby", want: "1000-piece puzzle", candles: "No", chocolate: "No", splurge: "Good socks" }],
      ["Casey Patel", { sweet: "Macarons", drink: "Chai", restaurant: "Panera", colors: "Purple", scent: "Lavender", bookstore: "Full Circle Books", hobbies: "Journaling, hiking", need: "Notebook", want: "Nice pens", lotions: "Yes", lotions_scent: "Lavender", candles: "Yes", candles_scent: "Lavender", alcohol: "No", chocolate: "Yes", collection: "Washi tape" }],
      ["Riley Brooks", { salty: "Popcorn", sweet: "Anything caramel", drink: "Coke Zero", restaurant: "Chili's", sports: "Chiefs", colors: "Red", hobbies: "Movies, fishing", stores: "Bass Pro", need: "Lunch bag", want: "Movie gift card", lotions: "No", candles: "No", alcohol: "Yes", alcohol_flavor: "Light beer", chocolate: "Yes" }],
    ].map(([name, answers], i) => ({
      id: this.uid(), name, email: name.toLowerCase().replace(/\s+/g, ".") + "@example.org", answers,
      token: "seed-" + i, pin: "1234", pinFails: 0, lockedUntil: 0, assignedTo: null, joinedAt: new Date(now - (8 - i) * day * 0.6).toISOString(), updatedAt: null,
    }));
    const y = new Date().getFullYear();
    return {
      config: {
        eventName: "OMAG Secret Santa", budget: "up to $30", exchangeDate: "Tue, Dec 16 at 11:00 AM",
        location: "Training Room", notes: "", allowedDomain: "", showMatchesToAdmin: false, siteUrl: "",
        emailEnabled: false, signupDeadline: new Date(y, 11, 2, 23, 59).toISOString(),
        revealAt: new Date(y, 11, 3, 8, 0).toISOString(), drawnAt: null, emailsSentAt: null,
      },
      people, messages: [], adminKey: "demo",
    };
  },
  me(s, token) {
    const p = s.people.find(x => x.token === token && token);
    if (!p) throw new Error("That sign-in has expired. Please sign in again with your email and PIN.");
    return p;
  },
  admin(s, key) { if (key !== s.adminKey) throw new Error("Incorrect admin passcode."); },
  clean(a) {
    const o = {};
    Object.entries(a || {}).slice(0, 40).forEach(([k, v]) => { if (/^[A-Za-z0-9_-]{1,40}$/.test(k) && String(v ?? "").trim()) o[k] = String(v).trim().slice(0, 1000); });
    return o;
  },
  pub(c) { const { eventName, budget, exchangeDate, location, notes, signupDeadline, revealAt, allowedDomain } = c; return { eventName, budget, exchangeDate, location, notes, signupDeadline, revealAt, allowedDomain }; },
  draw(s) {
    if (s.people.length < 3) throw new Error(`You need at least 3 people to draw names (currently ${s.people.length}).`);
    const ids = s.people.map(p => p.id);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    ids.forEach((id, i) => { s.people.find(p => p.id === id).assignedTo = ids[(i + 1) % ids.length]; });
    s.messages = [];
    s.config.drawnAt = new Date().toISOString(); s.config.emailsSentAt = null;
    // Demo nicety: the Secret Santa of any real demo user asks them a question.
    s.people.filter(p => !p.token.startsWith("seed-")).forEach(p => {
      const santa = s.people.find(x => x.assignedTo === p.id);
      if (santa) s.messages.push({ id: this.uid(), giverId: santa.id, recipientId: p.id, question: "Do you prefer sweet or salty snacks? 🍫🥨", answer: null, askedAt: new Date().toISOString(), answeredAt: null });
    });
  },
  async call(fn, a) {
    await sleep(220);
    const s = this.load();
    const f = this.fns[fn];
    if (!f) throw new Error("Unknown function " + fn);
    const out = f.call(this, s, a);
    this.save();
    return JSON.parse(JSON.stringify(out ?? null));
  },
  fns: {
    gx_get_public(s) {
      return { config: this.pub(s.config), phase: phaseOf(s.config), emailEnabled: s.config.emailEnabled, now: new Date().toISOString(),
        participants: [...s.people].sort((a, b) => a.joinedAt.localeCompare(b.joinedAt)).map(p => ({ name: p.name, joinedAt: p.joinedAt })) };
    },
    gx_signup(s, { p_name, p_email, p_answers, p_pin }) {
      const c = s.config, name = String(p_name || "").trim().slice(0, 80), email = String(p_email || "").trim().toLowerCase();
      if (phaseOf(c) !== "open") throw new Error("Sign-ups are closed.");
      if (!name) throw new Error("Please enter your name.");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error("Please enter a valid email address.");
      if (c.allowedDomain && !email.endsWith("@" + c.allowedDomain.toLowerCase())) throw new Error(`Please use your @${c.allowedDomain} email address.`);
      if (!/^[0-9]{4}$/.test(String(p_pin || ""))) throw new Error("Your PIN needs to be exactly 4 numbers.");
      if (s.people.some(p => p.email === email)) throw new Error("That email is already signed up. Use \"Sign in\" with your email and PIN.");
      const p = { id: this.uid(), name, email, answers: this.clean(p_answers), token: "demo-" + this.uid(), pin: p_pin, pinFails: 0, lockedUntil: 0, assignedTo: null, joinedAt: new Date().toISOString(), updatedAt: null };
      s.people.push(p);
      return { token: p.token, id: p.id, emailEnabled: c.emailEnabled };
    },
    gx_login(s, { p_email, p_pin }) {
      const bad = { ok: false, error: "That email and PIN don't match. Check both and try again." };
      const p = s.people.find(x => x.email === String(p_email || "").trim().toLowerCase());
      if (!p || !p.pin) return bad;
      if (p.lockedUntil > Date.now()) return { ok: false, error: "Too many tries. Wait 15 minutes, or ask the organizer to reset your PIN." };
      if (String(p_pin || "") !== p.pin) { p.pinFails = (p.pinFails || 0) + 1; if (p.pinFails >= 5) { p.pinFails = 0; p.lockedUntil = Date.now() + 9e5; } return bad; }
      p.pinFails = 0; p.lockedUntil = 0;
      return { ok: true, token: p.token };
    },
    gx_set_pin(s, { p_token, p_pin }) {
      const p = this.me(s, p_token);
      if (!/^[0-9]{4}$/.test(String(p_pin || ""))) throw new Error("Your PIN needs to be exactly 4 numbers.");
      p.pin = p_pin; p.pinFails = 0; p.lockedUntil = 0; return { ok: true };
    },
    gx_admin_reset_pin(s, { p_key, p_id }) {
      this.admin(s, p_key);
      const p = s.people.find(x => x.id === p_id); if (!p) throw new Error("Person not found.");
      p.pin = String(Math.floor(Math.random() * 10000)).padStart(4, "0"); p.pinFails = 0; p.lockedUntil = 0;
      return { ok: true, pin: p.pin };
    },
    gx_resend_link(s) { return { ok: !!s.config.emailEnabled, emailEnabled: !!s.config.emailEnabled }; },
    gx_get_me(s, { p_token }) {
      const p = this.me(s, p_token), c = s.config, ph = phaseOf(c);
      let recipient = null, sent = [], received = [];
      if (ph === "revealed" && p.assignedTo) {
        const r = s.people.find(x => x.id === p.assignedTo);
        recipient = { name: r.name, answers: r.answers };
        const santa = s.people.find(x => x.assignedTo === p.id);
        sent = s.messages.filter(m => m.giverId === p.id && m.recipientId === r.id);
        received = s.messages.filter(m => m.recipientId === p.id && santa && m.giverId === santa.id);
      }
      const strip = m => ({ id: m.id, question: m.question, answer: m.answer, askedAt: m.askedAt, answeredAt: m.answeredAt });
      return { me: { id: p.id, name: p.name, email: p.email, answers: p.answers, hasPin: !!p.pin }, config: this.pub(c), phase: ph, drawn: !!c.drawnAt,
        recipient, sentQuestions: sent.map(strip), receivedQuestions: received.map(strip) };
    },
    gx_update_me(s, { p_token, p_name, p_answers }) {
      const p = this.me(s, p_token);
      if (String(p_name || "").trim()) p.name = String(p_name).trim().slice(0, 80);
      p.answers = this.clean(p_answers); p.updatedAt = new Date().toISOString();
      return { ok: true };
    },
    gx_withdraw_me(s, { p_token }) {
      const p = this.me(s, p_token);
      if (s.config.drawnAt) throw new Error("Names have already been drawn. Please talk to the organizer.");
      s.people = s.people.filter(x => x.id !== p.id);
      return { ok: true };
    },
    gx_ask(s, { p_token, p_question }) {
      const p = this.me(s, p_token), q = String(p_question || "").trim().slice(0, 500);
      if (phaseOf(s.config) !== "revealed" || !p.assignedTo) throw new Error("You can ask questions once names are revealed.");
      if (!q) throw new Error("Type a question first.");
      const r = s.people.find(x => x.id === p.assignedTo);
      const m = { id: this.uid(), giverId: p.id, recipientId: r.id, question: q, answer: null, askedAt: new Date().toISOString(), answeredAt: null };
      if (r.token.startsWith("seed-")) { m.answer = "Great question! Honestly, anything from my list makes me happy. 🎄"; m.answeredAt = new Date().toISOString(); }
      s.messages.push(m);
      return { ok: true };
    },
    gx_reply(s, { p_token, p_id, p_answer }) {
      const p = this.me(s, p_token), a = String(p_answer || "").trim().slice(0, 500);
      if (!a) throw new Error("Type an answer first.");
      const m = s.messages.find(x => x.id === p_id && x.recipientId === p.id);
      if (!m) throw new Error("Question not found.");
      m.answer = a; m.answeredAt = new Date().toISOString();
      return { ok: true };
    },
    gx_admin_get(s, { p_key }) {
      this.admin(s, p_key);
      const c = s.config;
      return { config: { ...c }, phase: phaseOf(c), pendingEmails: 0, failedEmails: 0,
        people: s.people.map(p => ({ id: p.id, name: p.name, email: p.email, joinedAt: p.joinedAt, updatedAt: p.updatedAt,
          answerCount: Object.keys(p.answers).length,
          assignedToName: c.showMatchesToAdmin ? (s.people.find(x => x.id === p.assignedTo) || {}).name || null : null })) };
    },
    gx_admin_save(s, { p_key, p_cfg }) {
      this.admin(s, p_key);
      const c = s.config;
      ["eventName", "budget", "exchangeDate", "location", "notes", "siteUrl"].forEach(k => { if (k in p_cfg) c[k] = String(p_cfg[k] ?? "").trim(); });
      if (!c.eventName) c.eventName = "OMAG Holiday Gift Exchange";
      if ("allowedDomain" in p_cfg) c.allowedDomain = String(p_cfg.allowedDomain || "").trim().replace(/^@/, "").toLowerCase();
      ["signupDeadline", "revealAt"].forEach(k => { if (k in p_cfg) c[k] = p_cfg[k] || null; });
      ["showMatchesToAdmin", "emailEnabled"].forEach(k => { if (k in p_cfg) c[k] = !!p_cfg[k]; });
      return { ok: true };
    },
    gx_admin_draw(s, { p_key }) { this.admin(s, p_key); if (s.config.drawnAt) throw new Error("Names are already drawn. Reset first to redraw."); this.draw(s); return { ok: true }; },
    gx_admin_reveal_now(s, { p_key }) { this.admin(s, p_key); if (!s.config.drawnAt) this.draw(s); s.config.revealAt = new Date().toISOString(); return { ok: true }; },
    gx_admin_reset(s, { p_key }) { this.admin(s, p_key); s.messages = []; s.people.forEach(p => p.assignedTo = null); s.config.drawnAt = null; s.config.emailsSentAt = null; return { ok: true }; },
    gx_admin_resend_reveal(s, { p_key }) { this.admin(s, p_key); if (phaseOf(s.config) !== "revealed") throw new Error("Names haven't been revealed yet."); return { ok: true }; },
    gx_admin_send_link(s, { p_key }) { this.admin(s, p_key); if (!s.config.emailEnabled) throw new Error("Email is turned off. Turn it on in Settings first."); return { ok: true }; },
    gx_admin_remove(s, { p_key, p_id }) {
      this.admin(s, p_key);
      if (s.config.drawnAt) throw new Error("Reset the draw before removing someone (removing them would break the loop).");
      s.people = s.people.filter(p => p.id !== p_id); return { ok: true };
    },
    gx_admin_change_passcode(s, { p_key, p_new }) { this.admin(s, p_key); if (String(p_new || "").length < 8) throw new Error("Use at least 8 characters."); s.adminKey = p_new; return { ok: true }; },
  },
};

/* =====================================================================
   Router
   ===================================================================== */
const ROUTES = { home: viewHome, join: viewJoin, me: viewMe, lost: viewLost, admin: viewAdmin };
let tickTimer = null;
let PUB = null; // last public data

function route() { const h = (location.hash || "").replace(/^#\/?/, "").split(/[?&/]/)[0]; return ROUTES[h] ? h : "home"; }
async function render() {
  clearInterval(tickTimer);
  const r = route();
  renderNav(r);
  const app = $("#app");
  app.innerHTML = `<div class="loading"><span class="spinner"></span></div>`;
  try { await ROUTES[r](app); refreshBadge(r); }
  catch (e) { app.innerHTML = `<div class="wrap page"><div class="card"><h2>Hmm, something went wrong</h2><p class="sub">${esc(e.message)}</p><a class="btn btn-pine" href="#home">Back to home</a></div></div>`; }
  window.scrollTo(0, 0);
}
function setBrand(name) { $("#brand-name").textContent = String(name || "Secret Santa").replace(/^OMAG\s+/i, "") || "Secret Santa"; }
let BADGE = 0;
function renderNav(r) {
  const tok = getToken();
  const open = !PUB || PUB.phase === "open";
  const items = [["home", "Home"]];
  if (tok) items.push(["me", "My page", false, BADGE]);
  else { items.push(["lost", "Sign in"]); if (open) items.push(["join", "Join", true]); }
  $("#nav").innerHTML = items.map(([k, label, cta, b]) => `<a href="#${k}" class="${cta ? "cta" : ""} ${r === k ? "on" : ""}">${esc(label)}${b ? `<span class="badge" aria-label="${b} new">${b}</span>` : ""}</a>`).join("");
}
// New-activity count: questions waiting for your answer + answers you haven't seen yet.
function activityCount(me) {
  if (!me || !me.recipient) return 0;
  const seen = local.get("gx_ans_seen_" + me.me.id) || "";
  const waiting = (me.receivedQuestions || []).filter(m => !m.answer).length;
  const fresh = (me.sentQuestions || []).filter(m => m.answeredAt && m.answeredAt > seen).length;
  return waiting + fresh;
}
async function refreshBadge(r) {
  if (!getToken()) { BADGE = 0; return; }
  try { const me = (r === "me" && ME) ? ME : await rpc("gx_get_me", { p_token: getToken() }); BADGE = activityCount(me); }
  catch { BADGE = 0; }
  renderNav(route());
}
async function loadPublic() {
  PUB = await rpc("gx_get_public");
  setBrand(PUB.config.eventName || "Gift Exchange");
  document.title = PUB.config.eventName || "Gift Exchange";
  return PUB;
}

function countdownHTML(target, label) {
  return `<div class="cd-label">${esc(label)}</div>
    <div class="countdown" data-target="${esc(target)}">
      ${["days", "hours", "min", "sec"].map(u => `<div class="cd-tile"><div class="cd-num" data-u="${u}">--</div><div class="cd-unit">${u}</div></div>`).join("")}
    </div>`;
}
function startCountdown(onZero) {
  const el = $(".countdown"); if (!el) return;
  const target = Date.parse(el.dataset.target);
  const tick = () => {
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    const v = { days: Math.floor(s / 86400), hours: Math.floor(s % 86400 / 3600), min: Math.floor(s % 3600 / 60), sec: s % 60 };
    Object.entries(v).forEach(([u, n]) => { const x = $(`[data-u="${u}"]`, el); if (x) x.textContent = String(n).padStart(2, "0"); });
    if (s === 0) { clearInterval(tickTimer); onZero && setTimeout(onZero, 1500); }
  };
  tick(); tickTimer = setInterval(tick, 1000);
}

function ornament(len, color) {
  return `<svg class="orn" width="44" height="${len + 50}" viewBox="0 0 44 ${len + 50}"><line x1="22" y1="0" x2="22" y2="${len}" stroke="rgba(251,245,233,.35)" stroke-width="1.5"/>
    <rect x="16" y="${len - 4}" width="12" height="9" rx="2" fill="#c8a24a"/><circle cx="22" cy="${len + 22}" r="19" fill="${color}"/>
    <ellipse cx="15" cy="${len + 14}" rx="5" ry="7" fill="rgba(255,255,255,.35)" transform="rotate(30 15 ${len + 14})"/></svg>`;
}

function fieldHTML(q, answers) {
  answers = answers || {};
  const val = answers[q.id] || "";
  const v = esc(val);
  let input;
  if (q.type === "choice") {
    const opts = (q.options || []).map(o => `<label><input type="radio" name="${esc(q.id)}" value="${esc(o)}" ${o === val ? "checked" : ""}><span>${esc(o)}</span></label>`).join("");
    const det = q.detail ? `<input class="choice-detail" type="text" name="${esc(q.detail.id)}" value="${esc(answers[q.detail.id] || "")}" placeholder="${esc(q.detail.placeholder || "")}" maxlength="300" aria-label="${esc(q.label)}: ${esc(q.detail.placeholder || "details")}">` : "";
    return `<div class="f" role="group" aria-label="${esc(q.label)}"><span style="display:block;font-weight:700;font-size:14px;margin-bottom:8px">${esc(q.label)}</span><div class="pills">${opts}</div>${det}</div>`;
  }
  if (q.type === "textarea") input = `<textarea name="${esc(q.id)}" placeholder="${esc(q.placeholder || "")}" maxlength="1000">${v}</textarea>`;
  else if (q.type === "select") input = `<select name="${esc(q.id)}">${(q.options || []).map(o => `<option value="${esc(o)}" ${o === val ? "selected" : ""}>${esc(o || "Choose…")}</option>`).join("")}</select>`;
  else input = `<input type="text" name="${esc(q.id)}" value="${v}" placeholder="${esc(q.placeholder || "")}" maxlength="1000">`;
  return `<label class="f ${q.type === "textarea" ? "full" : ""}"><span>${esc(q.label)}</span>${q.hint ? `<small>${esc(q.hint)}</small>` : ""}${input}</label>`;
}
function fieldsHTML(answers) {
  const groups = [];
  CONFIG.QUESTIONS.forEach(q => {
    const sec = q.section || "";
    if (!groups.length || groups[groups.length - 1].sec !== sec) groups.push({ sec, qs: [] });
    groups[groups.length - 1].qs.push(q);
  });
  return groups.map(g => `${g.sec ? `<div class="divider">${esc(g.sec)}</div>` : ""}<div class="grid2">${g.qs.map(q => fieldHTML(q, answers)).join("")}</div>`).join("");
}
function collectAnswers(form) {
  const a = {};
  const take = id => { const el = form.elements[id]; const v = el && typeof el.value === "string" ? el.value.trim() : ""; if (v) a[id] = v; };
  CONFIG.QUESTIONS.forEach(q => { take(q.id); if (q.detail) take(q.detail.id); });
  return a;
}
// One display row per question: [label, value, wide]
function answerRows(answers) {
  answers = answers || {};
  return CONFIG.QUESTIONS.map(q => {
    let v = answers[q.id] || "";
    if (q.detail && answers[q.detail.id]) v = v ? `${v} · ${answers[q.detail.id]}` : answers[q.detail.id];
    return [q.label, v, q.type === "textarea"];
  });
}

/* ---------- My page ---------- */
let ME = null;
async function viewMe(app) {
  const tok = getToken();
  if (!tok) {
    await loadPublic(); renderNav("me");
    location.hash = "#lost";
    return;
  }
  try { ME = await rpc("gx_get_me", { p_token: tok }); }
  catch (e) {
    setToken(null); renderNav("me");
    app.innerHTML = `<div class="wrap page" style="max-width:640px"><div class="card"><h2>We couldn't find you</h2><p class="sub">${esc(e.message)}</p><a class="btn btn-primary" href="#lost">Sign in</a></div></div>`;
    return;
  }
  PUB = PUB || { phase: ME.phase, config: ME.config };
  PUB.phase = ME.phase;
  setBrand(ME.config.eventName);
  renderNav("me");
  const c = ME.config, me = ME.me, rev = ME.phase === "revealed" && ME.recipient;

  let status;
  if (rev) status = `<div class="status"><div class="ic">🎁</div><div><b>Names are drawn!</b><span>Spend ${esc(c.budget || "what you like")}${c.exchangeDate ? " · Santas revealed " + esc(c.exchangeDate) : ""}</span></div></div>`;
  else if (ME.phase === "closed") status = `<div class="status"><div class="ic">🔒</div><div><b>You're in, ${esc(firstName(me.name))}. Sign-ups are closed.</b><span>${c.revealAt ? "Names drawn " + esc(fmtDate(c.revealAt)) + "." : "Names will be drawn soon."} You can still update your list.</span></div></div>`;
  else status = `<div class="status"><div class="ic">✅</div><div><b>You're in, ${esc(firstName(me.name))}!</b><span>${c.revealAt ? "Names drawn " + esc(fmtDate(c.revealAt)) + ". " : ""}Edit your list any time.</span></div></div>`;

  const seenKey = "gx_seen_" + me.id + "_" + (ME.recipient ? ME.recipient.name : "");
  const seen = !!local.get(seenKey);

  app.innerHTML = `
  <div class="wrap page">
    ${status}
    <div class="me-grid">
      <div>
        ${rev ? `<div class="card" id="reveal-card">
            ${seen ? recipientHTML() : `<div class="reveal-stage" id="stage">
              <div class="r-eyebrow">Your Secret Santa assignment</div>
              <button class="giftbox" id="gift" aria-label="Open your gift to see who you drew"><span class="body"></span><span class="rib-v"></span><span class="lid"></span><span class="bow"></span></button>
              <div class="tap-hint">Tap the gift to see who you drew</div></div>`}
          </div>
          <div class="card" id="ask-card">${askHTML()}</div>`
        : `<div class="card"><h2>Who did I draw?</h2><p class="sub">${ME.phase === "closed" && ME.drawn ? "Names are drawn and sealed until reveal time." : "Your person will appear here at reveal time."}</p>
           ${c.revealAt ? countdownHTML(c.revealAt, "Reveal in") : `<p class="note">The organizer hasn't set a reveal time yet.</p>`}</div>`}
        ${rev ? `<div class="card" id="recv-card">${receivedHTML()}</div>` : ""}
      </div>
      <div>
        <div class="card" id="mylist">${myListHTML()}</div>
      </div>
    </div>
  </div>`;

  if (!rev) startCountdown(() => render());
  const gift = $("#gift");
  if (gift) gift.onclick = async () => {
    gift.classList.add("open"); $(".tap-hint").style.opacity = 0;
    burst();
    await sleep(750);
    local.set(seenKey, "1");
    $("#reveal-card").innerHTML = recipientHTML();
    bindRecipient();
  };
  bindRecipient(); bindAsk(); bindReceived(); bindMyList();
  markAnswersSeen();
}
function markAnswersSeen() {
  const latest = (ME.sentQuestions || []).map(m => m.answeredAt || "").sort().pop();
  if (latest) local.set("gx_ans_seen_" + ME.me.id, latest);
}

function wishHTML(answers) {
  return `<div class="wish">${answerRows(answers).map(([label, v, wide]) => {
    return `<div class="item ${wide ? "wide" : ""}"><div class="q">${esc(label)}</div><div class="a ${v ? "" : "none"}">${v ? esc(v) : "—"}</div></div>`;
  }).join("")}</div>`;
}
function recipientHTML() {
  const r = ME.recipient;
  return `<div class="rcard">
    <div class="r-eyebrow">You're shopping for</div>
    <div class="r-name">${esc(r.name)}</div>
    <div class="r-meta">Treat them anonymously${CONFIG.SANTA_PERIOD ? " " + esc(CONFIG.SANTA_PERIOD) : ""} · Spend ${esc(ME.config.budget || "what you like")} total${ME.config.exchangeDate ? " · Santas revealed " + esc(ME.config.exchangeDate) : ""}. Their list is just a guide. Keep it secret! 🤫</div>
    ${wishHTML(r.answers)}
    <div class="form-actions"><button class="btn btn-pine btn-sm" id="print-r" type="button">🖨️ Print their list</button></div>
  </div>`;
}
function bindRecipient() { const b = $("#print-r"); if (b) b.onclick = () => printList(`${ME.recipient.name}'s favorite things`, ME.recipient.answers); }

function askHTML() {
  const r = ME.recipient, list = ME.sentQuestions || [];
  const seen = local.get("gx_ans_seen_" + ME.me.id) || "";
  const fresh = list.filter(m => m.answeredAt && m.answeredAt > seen).length;
  return `<h2>Ask ${esc(firstName(r.name))} a question${fresh ? `<span class="badge new">${fresh} new answer${fresh > 1 ? "s" : ""}</span>` : ""}</h2>
    <p class="sub">Not sure about a size or a flavor? Ask here. ${esc(firstName(r.name))} will get it from "your Secret Santa" and won't know it's you.</p>
    <div class="thread">${list.map(m => `<div class="bubble q"><small>You asked</small>${esc(m.question)}</div>
      ${m.answer ? `<div class="bubble a"><small>${esc(firstName(r.name))} said${m.answeredAt > seen ? " · new" : ""}</small>${esc(m.answer)}</div>` : `<div class="bubble wait">Waiting for an answer… Check back later.</div>`}`).join("")}</div>
    <form class="askrow" id="ask-form"><input type="text" name="q" maxlength="500" placeholder="e.g. Do you wear a medium or large?" aria-label="Your question"><button class="btn btn-primary btn-sm" type="submit">Send</button></form>`;
}
function bindAsk() {
  const f = $("#ask-form"); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault();
    const q = f.elements.q.value.trim(); if (!q) return;
    $("button", f).disabled = true;
    try {
      await rpc("gx_ask", { p_token: getToken(), p_question: q });
      ME = await rpc("gx_get_me", { p_token: getToken() });
      $("#ask-card").innerHTML = askHTML(); bindAsk(); markAnswersSeen();
      toast("Sent anonymously 🤫");
    } catch (err) { toast(err.message); $("button", f).disabled = false; }
  };
}
function receivedHTML() {
  const list = ME.receivedQuestions || [];
  const waiting = list.filter(m => !m.answer).length;
  return `<h2>From your Secret Santa${waiting ? `<span class="badge new">${waiting} new</span>` : ""}</h2>
    <p class="sub">${list.length ? "Your Santa asked you something. Your answer goes straight back to them. You won't see who they are until exchange day." : "If your Secret Santa has a question for you, it'll show up here. Check back now and then!"}</p>
    <div class="thread">${list.map(m => `<div class="bubble q"><small>Your Secret Santa asked</small>${esc(m.question)}</div>
      ${m.answer ? `<div class="bubble a"><small>You said</small>${esc(m.answer)}</div>`
        : `<form class="askrow reply-form" data-id="${esc(m.id)}" style="align-self:stretch"><input type="text" name="a" maxlength="500" placeholder="Your answer" aria-label="Your answer"><button class="btn btn-pine btn-sm" type="submit">Reply</button></form>`}`).join("")}</div>`;
}
function bindReceived() {
  $$(".reply-form").forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    const a = f.elements.a.value.trim(); if (!a) return;
    $("button", f).disabled = true;
    try {
      await rpc("gx_reply", { p_token: getToken(), p_id: f.dataset.id, p_answer: a });
      ME = await rpc("gx_get_me", { p_token: getToken() });
      $("#recv-card").innerHTML = receivedHTML(); bindReceived(); refreshBadge("me");
      toast("Answer sent!");
    } catch (err) { toast(err.message); $("button", f).disabled = false; }
  });
}

function myListHTML(editing = false) {
  const me = ME.me;
  if (editing) return `<h2>Edit my favorite things</h2><p class="sub">Changes show up for your Secret Santa right away.</p>
    <form id="edit-form"><label class="f" style="margin-bottom:14px"><span>Your name</span><input type="text" name="name" value="${esc(me.name)}" maxlength="80"></label>
    ${fieldsHTML(me.answers)}
    <div class="form-actions"><button class="btn btn-primary" type="submit">Save my list</button><button class="btn btn-ghost" type="button" id="cancel-edit">Cancel</button></div></form>`;
  return `<h2>My favorite things</h2><p class="sub">This is what your Secret Santa sees.</p>
    ${wishHTML(me.answers)}
    <div class="form-actions">
      <button class="btn btn-pine btn-sm" id="edit-list" type="button">✏️ Edit my list</button>
      <button class="btn btn-ghost btn-sm" id="print-mine" type="button">🖨️ Print</button>
      ${!ME.drawn ? `<button class="btn btn-danger btn-sm" id="withdraw" type="button">Leave the exchange</button>` : ""}
    </div>
    ${!me.hasPin ? `<p class="note" style="margin-top:16px">🔢 Set a PIN so you can sign in from your phone or another computer.</p>` : ""}
    <form class="askrow" id="pin-form" style="margin-top:16px"><input class="pin" type="password" name="pin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="new-password" aria-label="New 4-digit PIN"><button class="btn btn-ghost btn-sm" type="submit">${me.hasPin ? "Change my PIN" : "Set my PIN"}</button></form>
    <p style="font-size:12.5px;color:var(--muted);margin-top:16px">Signed in as ${esc(me.email)} on this device. <a href="#" id="signout">Sign out</a></p>`;
}
function bindMyList() {
  const box = $("#mylist");
  const e = $("#edit-list"); if (e) e.onclick = () => { box.innerHTML = myListHTML(true); bindMyList(); };
  const c = $("#cancel-edit"); if (c) c.onclick = () => { box.innerHTML = myListHTML(); bindMyList(); };
  const p = $("#print-mine"); if (p) p.onclick = () => printList(`${ME.me.name}'s favorite things`, ME.me.answers);
  const so = $("#signout"); if (so) so.onclick = ev => { ev.preventDefault(); setToken(null); location.hash = "#home"; };
  const pf = $("#pin-form"); if (pf) pf.onsubmit = async ev => {
    ev.preventDefault();
    try { await rpc("gx_set_pin", { p_token: getToken(), p_pin: pf.elements.pin.value.trim() }); ME.me.hasPin = true; toast("PIN saved. 🔢"); box.innerHTML = myListHTML(); bindMyList(); }
    catch (err) { toast(err.message); }
  };
  const w = $("#withdraw"); if (w) w.onclick = async () => {
    if (!await confirmBox("Leave the exchange?", "Your wish list will be deleted and your name removed from the board.", "Leave", true)) return;
    try { await rpc("gx_withdraw_me", { p_token: getToken() }); setToken(null); toast("You've left the exchange."); location.hash = "#home"; }
    catch (err) { toast(err.message); }
  };
  const f = $("#edit-form"); if (f) f.onsubmit = async ev => {
    ev.preventDefault();
    $("button[type=submit]", f).disabled = true;
    try {
      await rpc("gx_update_me", { p_token: getToken(), p_name: f.elements.name.value, p_answers: collectAnswers(f) });
      ME = await rpc("gx_get_me", { p_token: getToken() });
      box.innerHTML = myListHTML(); bindMyList(); toast("Saved! ✨");
    } catch (err) { toast(err.message); $("button[type=submit]", f).disabled = false; }
  };
}

function printList(title, answers) {
  const ev = (ME && ME.config) || (PUB && PUB.config) || {};
  const rows = answerRows(answers);
  $("#print-area").innerHTML = `<h1>${esc(title)}</h1><div class="pmeta">${esc(ev.eventName || "")}${ev.budget ? " · Spend " + esc(ev.budget) : ""}${ev.exchangeDate ? " · " + esc(ev.exchangeDate) : ""}</div>
    ${rows.map(([q, a]) => `<div class="prow"><div class="pq">${esc(q)}</div><div class="pa">${a ? esc(a) : "—"}</div></div>`).join("")}`;
  try { window.print(); } catch { toast("Printing isn't available here. Try from your browser's menu."); }
}

/* ---------- Admin ---------- */
async function viewAdmin(app) {
  renderNav("admin");
  const key = getAdminKey();
  if (!key) return adminLogin(app);
  let d;
  try { d = await rpc("gx_admin_get", { p_key: key }); }
  catch (e) { setAdminKey(null); return adminLogin(app, e.message); }
  const c = d.config, ph = d.phase, people = d.people;
  setBrand(c.eventName);

  app.innerHTML = `
  <div class="wrap page">
    <div class="sec-head"><div><h1 class="page-title">Organizer</h1><p>Manage dates, the draw, and who's in.</p></div>
      <button class="btn btn-ghost btn-sm" id="logout">Lock admin</button></div>

    <div class="stats">
      <div class="stat"><div class="k">Participants</div><div class="v">${people.length}</div></div>
      <div class="stat"><div class="k">Status</div><div class="v"><span class="phase-pill phase-${ph}">${ph === "open" ? "Sign-ups open" : ph === "closed" ? (c.drawnAt ? "Drawn · sealed" : "Sign-ups closed") : "Revealed"}</span></div></div>
      <div class="stat"><div class="k">Names drawn</div><div class="v" style="font-size:18px;margin-top:6px">${c.drawnAt ? esc(fmtDate(c.drawnAt)) : "Not yet"}</div></div>
    </div>

    <div class="card">
      <h2>The draw</h2>
      <p class="sub">${c.drawnAt ? (ph === "revealed" ? "Names are drawn and revealed. Everyone can see who they have." : "Names are drawn and sealed until the reveal time.")
        : `Names draw automatically at the "Names drawn" time (${esc(fmtDate(c.revealAt) || "not set")}), when everyone can see who they have. You can also draw now and keep them sealed until then. It's one big loop, so nobody gets themselves and there are no two-person swaps.`}</p>
      <div class="actions">
        ${!c.drawnAt ? `<button class="btn btn-pine" data-act="draw">Draw names now (keep sealed)</button>` : ""}
        ${ph !== "revealed" ? `<button class="btn btn-primary" data-act="reveal">🎁 Draw &amp; show everyone now</button>` : ""}
        ${c.drawnAt ? `<button class="btn btn-danger" data-act="reset">Reset the draw</button>` : ""}
      </div>
    </div>

    <form class="card" id="cfg-form">
      <h2>Settings</h2><p class="sub">Shown on the home page.</p>
      <div class="grid2">
        <label class="f"><span>Event name</span><input type="text" name="eventName" value="${esc(c.eventName)}"></label>
        <label class="f"><span>Spending limit</span><small>Shown as "Spend ___ total", e.g. "up to $30"</small><input type="text" name="budget" value="${esc(c.budget)}" placeholder="up to $30"></label>
        <label class="f"><span>Santas revealed (exchange day)</span><small>Free text, e.g. "Tue, Dec 16 at 11:00 AM"</small><input type="text" name="exchangeDate" value="${esc(c.exchangeDate)}"></label>
        <label class="f"><span>Location</span><small>Optional</small><input type="text" name="location" value="${esc(c.location)}"></label>
        <label class="f"><span>Sign-ups close</span><input type="datetime-local" name="signupDeadline" value="${toLocalInput(c.signupDeadline)}"></label>

        <label class="f full"><span>Note on the home page</span><small>Optional, e.g. "Sock exchange: bring cheap, garish socks stuffed with treats, tied with a bow!"</small><input type="text" name="notes" value="${esc(c.notes)}"></label>
        <label class="f full"><span>Only allow sign-ups from</span><small>e.g. omag.org, so only @omag.org addresses can join (leave blank to allow any)</small><input type="text" name="allowedDomain" value="${esc(c.allowedDomain)}"></label>
        <label class="check full"><input type="checkbox" name="showMatchesToAdmin" ${c.showMatchesToAdmin ? "checked" : ""}><span><b>Show me who drew whom</b>. Leave off if you're participating too and want to be surprised.</span></label>
      </div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">Save settings</button></div>

    <div class="card">
      <h2>Participants</h2>
      <p class="sub">${people.length} signed up.${c.drawnAt ? " Reset the draw to remove someone." : ""}</p>
      ${people.length ? `<div class="tablewrap"><table class="people"><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>List</th>${c.showMatchesToAdmin && c.drawnAt ? "<th>Is giving to</th>" : ""}<th></th></tr></thead><tbody>
      ${people.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.email)}</td><td>${esc(fmtDay(p.joinedAt))}</td><td>${p.answerCount} answers</td>

  };
  $("#pass-form").onsubmit = async e => {
    e.preventDefault();
    const v = e.target.elements.p.value;

    catch (err) { toast(err.message); }

}
function showPin(name, pin) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="text-align:center"><h3>New PIN for ${esc(name)}</h3>
    <div class="pinbig">${esc(pin)}</div><p>Give this to ${esc(firstName(name))}. They can change it on their page after signing in.</p>
    <div class="actions" style="justify-content:center"><button class="btn btn-pine btn-sm">Done</button></div></div>`;
  $("button", bg).onclick = () => bg.remove();
  document.body.appendChild(bg);
}
function adminLogin(app, err) {
  app.innerHTML = `<div class="wrap page" style="max-width:520px">
    <h1 class="page-title">Organizer</h1><p class="page-sub">Enter the admin passcode.</p>
    <form class="card" id="admin-login"><label class="f"><span>Passcode</span><input type="password" name="k" required autocomplete="current-password"></label>
      ${err ? `<div class="err">${esc(err)}</div>` : ""}
      <div class="form-actions"><button class="btn btn-pine" type="submit">Unlock</button></div></form></div>`;
  $("#admin-login").onsubmit = e => { e.preventDefault(); setAdminKey(e.target.elements.k.value); render(); };
  $("#admin-login input").focus();
}

/* =====================================================================
   Effects: snow + confetti
   ===================================================================== */
const reduceMotion = safe(() => matchMedia("(prefers-reduced-motion: reduce)").matches, false);
let snowRAF = null;
function startSnow(cv) {
  cancelAnimationFrame(snowRAF);
  if (!cv || reduceMotion) return;
  const ctx = cv.getContext("2d"); let W, H, flakes;
  const size = () => { const r = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * r; cv.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0); };
  size();
  flakes = Array.from({ length: Math.round(W / 12) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.2 + .6, s: Math.random() * .5 + .25, d: Math.random() * Math.PI * 2 }));
  addEventListener("resize", size);
  const step = () => {
    if (!document.body.contains(cv)) return;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = "rgba(255,255,255,.75)";
    for (const f of flakes) {
      f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .3;
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    snowRAF = requestAnimationFrame(step);
  };
  step();
}
function burst() {
  if (reduceMotion) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d"), r = devicePixelRatio || 1;
  cv.width = innerWidth * r; cv.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0);
  const colors = ["#b0283f", "#c8a24a", "#165141", "#fbf5e9", "#3a6a9a"];
  const parts = Array.from({ length: 160 }, () => ({
    x: innerWidth / 2, y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4,
    w: Math.random() * 8 + 4, h: Math.random() * 5 + 3, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)],
  }));
  const t0 = performance.now();
  const step = t => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (t - t0 < 3200) requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(step);
}

(function init() {
  // Personal links look like  https://site/?t=TOKEN#me  — store the token and tidy the address bar.
  const t = safe(() => new URLSearchParams(location.search).get("t"));
  if (t) {
    setToken(t);
    safe(() => history.replaceState(null, "", location.pathname + "#me"));
    if (!location.hash) location.hash = "#me";
  }
  if (DEMO) {
    $("#demo-bar").hidden = false;
    $("#demo-reset").onclick = () => { Mock.reset(); toast("Demo reset."); location.hash = "#home"; render(); };
  }
  addEventListener("hashchange", render);
  render();
})();
